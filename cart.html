<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart | THREADVERSE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav>
        <div class="logo">
            THREADVERSE
        </div>

        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="index.html#products">SHOP</a>
            <a href="cart.html">CART</a>
            <a href="index.html#about">ABOUT</a>
        </div>
    </nav>


    <!-- CART PAGE -->
    <main class="cart-page">

        <div class="cart-heading">
            <p>YOUR THREADVERSE</p>
            <h1>Shopping Cart</h1>
        </div>


        <!-- PRODUCTS WILL APPEAR HERE -->
        <div id="cart-container">
            <p>Loading your cart...</p>
        </div>


        <!-- TOTAL AND CHECKOUT -->
        <div id="cart-summary">

            <div class="cart-total-box">

                <h2>
                    Cart Total:
                    <span id="cart-total">₹0</span>
                </h2>

                <button
                    id="checkout-button"
                    class="checkout-button"
                    type="button"
                >
                    PROCEED TO CHECKOUT
                </button>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>
        <h2>THREADVERSE</h2>
        <p>A World of Custom Wear</p>
        <p>© 2026 THREADVERSE. All rights reserved.</p>
    </footer>


    <!-- JAVASCRIPT -->
    <script src="cart.js"></script>

</body>

</html>
