```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | THREADVERSE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav>

        <div class="logo">
            THREADVERSE
        </div>

        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="index.html#products">SHOP</a>
            <a href="cart.html">CART</a>
        </div>

    </nav>


    <!-- CHECKOUT PAGE -->
    <main class="checkout-page">

        <div class="checkout-heading">

            <p>COMPLETE YOUR ORDER</p>

            <h1>Checkout</h1>

        </div>


        <div class="checkout-container">


            <!-- CUSTOMER FORM -->
            <section class="checkout-form-section">

                <h2>Customer Details</h2>

                <form id="checkout-form">

                    <label for="customer-name">
                        FULL NAME
                    </label>

                    <input
                        type="text"
                        id="customer-name"
                        required
                    >


                    <label for="customer-email">
                        EMAIL ADDRESS
                    </label>

                    <input
                        type="email"
                        id="customer-email"
                        required
                    >


                    <label for="customer-phone">
                        PHONE NUMBER
                    </label>

                    <input
                        type="tel"
                        id="customer-phone"
                        required
                    >


                    <h2>Delivery Address</h2>


                    <label for="address">
                        FULL ADDRESS
                    </label>

                    <textarea
                        id="address"
                        rows="4"
                        required
                    ></textarea>


                    <label for="city">
                        CITY
                    </label>

                    <input
                        type="text"
                        id="city"
                        required
                    >


                    <label for="state">
                        STATE
                    </label>

                    <input
                        type="text"
                        id="state"
                        required
                    >


                    <label for="pincode">
                        PIN CODE
                    </label>

                    <input
                        type="text"
                        id="pincode"
                        required
                    >


                    <button
                        type="submit"
                        class="place-order-button"
                    >
                        PLACE ORDER
                    </button>

                </form>

            </section>


            <!-- ORDER SUMMARY -->
            <aside class="checkout-summary">

                <h2>Your Order</h2>

                <div id="checkout-items">
                    Loading order...
                </div>

                <div class="checkout-total">

                    <span>Total</span>

                    <strong id="checkout-total-price">
                        ₹0
                    </strong>

                </div>

            </aside>


        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <h2>THREADVERSE</h2>

        <p>A World of Custom Wear</p>

        <p>© 2026 THREADVERSE. All rights reserved.</p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="checkout.js"></script>
</body>

</body>

</html>
```
