    <style>

        /* =====================================================
           THREADVERSE PRODUCT PAGE
           FINAL COLOR + VISIBILITY SYSTEM
        ===================================================== */

        :root {

            --tv-black: #08090b;
            --tv-black-soft: #0d0e11;

            --tv-card: #15171b;
            --tv-card-hover: #1c1f25;

            --tv-white: #ffffff;
            --tv-soft-white: #f4f4f5;

            --tv-gray: #b7b9c0;
            --tv-muted: #858891;

            --tv-purple: #8b5cf6;
            --tv-purple-light: #a78bfa;
            --tv-purple-bright: #b79cff;

            --tv-purple-bg: rgba(139, 92, 246, 0.12);
            --tv-purple-bg-hover: rgba(139, 92, 246, 0.20);

            --tv-border: rgba(255,255,255,0.14);
            --tv-border-strong: rgba(255,255,255,0.28);

            --tv-radius: 10px;

            --tv-transition:
                0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }


        /* =====================================================
           BASE
        ===================================================== */

        .product-page {

            width: min(1220px, calc(100% - 40px));

            margin: 0 auto;

            padding: 125px 0 90px;

            min-height: 70vh;
        }


        /* =====================================================
           BACK TO SHOP
        ===================================================== */

        .back-to-shop {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 38px;

            color: var(--tv-gray) !important;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 1px;

            transition:
                color var(--tv-transition),
                transform var(--tv-transition);
        }


        .back-to-shop:hover {

            color: var(--tv-white) !important;

            transform: translateX(-5px);
        }


        /* =====================================================
           PRODUCT GRID
        ===================================================== */

        .single-product-container {

            display: grid;

            grid-template-columns:
                minmax(420px, 1fr)
                minmax(380px, 0.95fr);

            gap: 64px;

            align-items: start;

            animation:
                productReveal
                0.7s
                ease both;
        }


        @keyframes productReveal {

            from {

                opacity: 0;

                transform: translateY(25px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }


        /* =====================================================
           PRODUCT IMAGE
        ===================================================== */

        .single-product-image-container {

            width: 100%;

            background: var(--tv-card);

            border:
                1px solid
                var(--tv-border);

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.38);

            transition:
                transform 0.45s ease,
                border-color 0.45s ease,
                box-shadow 0.45s ease;
        }


        .single-product-image-container:hover {

            transform: translateY(-5px);

            border-color:
                rgba(139,92,246,0.45);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.50),
                0 0 50px
                rgba(139,92,246,0.06);
        }


        .single-product-image {

            display: block;

            width: 100%;

            max-height: 650px;

            object-fit: cover;
        }


        /* =====================================================
           PRODUCT DETAILS
        ===================================================== */

        .single-product-details {

            padding: 10px 0 30px;

            color: var(--tv-white) !important;
        }


        /* =====================================================
           CATEGORY
        ===================================================== */

        .single-product-category {

            margin: 0 0 17px;

            color:
                var(--tv-purple-bright) !important;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 2.6px;

            text-transform: uppercase;
        }


        /* =====================================================
           PRODUCT NAME
        ===================================================== */

        .single-product-name {

            margin: 0 0 22px;

            color:
                #ffffff !important;

            font-size:
                clamp(36px, 4vw, 58px);

            line-height: 1.08;

            letter-spacing: -1.8px;

            font-weight: 800;
        }


        /* =====================================================
           PRICE
        ===================================================== */

        .single-product-price {

            margin: 0 0 25px;

            color:
                #ffffff !important;

            font-size: 30px;

            font-weight: 800;

            letter-spacing: 0.2px;
        }


        /* =====================================================
           DESCRIPTION
        ===================================================== */

        .single-product-description {

            max-width: 600px;

            margin: 0 0 35px;

            color:
                var(--tv-gray) !important;

            font-size: 16px;

            line-height: 1.8;
        }


        /* =====================================================
           OPTION TITLE
        ===================================================== */

        .option-title {

            margin: 27px 0 13px;

            color:
                #ffffff !important;

            font-size: 13px;

            font-weight: 800;

            letter-spacing: 1.7px;

            text-transform: uppercase;
        }


        /* =====================================================
           SIZE OPTIONS
        ===================================================== */

        .size-options {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 5px;
        }


        /* =====================================================
           SIZE BUTTON
           NORMAL
        ===================================================== */

        .single-product-details .size-button {

            display: flex !important;

            align-items: center;

            justify-content: center;

            min-width: 62px;

            height: 52px;

            padding: 0 16px;

            background:
                #17171c !important;

            color:
                #ffffff !important;

            border:
                1px solid
                rgba(255,255,255,0.30) !important;

            border-radius:
                10px !important;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            opacity: 1 !important;

            visibility: visible !important;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,0.18);

            transition:
                background var(--tv-transition),
                border-color var(--tv-transition),
                color var(--tv-transition),
                transform var(--tv-transition),
                box-shadow var(--tv-transition);
        }


        /* =====================================================
           SIZE HOVER
        ===================================================== */

        .single-product-details .size-button:hover {

            background:
                rgba(139,92,246,0.16) !important;

            color:
                #ffffff !important;

            border-color:
                #8b5cf6 !important;

            transform:
                translateY(-3px);

            box-shadow:
                0 10px 30px
                rgba(139,92,246,0.14);
        }


        /* =====================================================
           SELECTED SIZE
           THIS IS THE IMPORTANT FIX
        ===================================================== */

        .single-product-details .size-button.selected-size {

            background:
                #8b5cf6 !important;

            color:
                #ffffff !important;

            border:
                1px solid
                #b79cff !important;

            transform:
                translateY(-2px)
                scale(1.02);

            box-shadow:
                0 10px 30px
                rgba(139,92,246,0.30),
                0 0 0 1px
                rgba(167,139,250,0.18);

            opacity: 1 !important;

            visibility: visible !important;
        }


        /* =====================================================
           SELECTED SIZE HOVER
        ===================================================== */

        .single-product-details
        .size-button.selected-size:hover {

            background:
                #9b6cff !important;

            border-color:
                #c4b5fd !important;

            color:
                #ffffff !important;
        }


        /* =====================================================
           QUANTITY CONTROLS
        ===================================================== */

        .quantity-controls {

            display: inline-flex !important;

            align-items: center;

            height: 52px;

            background:
                #17171c !important;

            border:
                1px solid
                rgba(255,255,255,0.30) !important;

            border-radius:
                10px !important;

            overflow: hidden;

            opacity: 1 !important;

            visibility: visible !important;

            box-shadow:
                0 6px 22px
                rgba(0,0,0,0.20);
        }


        /* =====================================================
           QUANTITY BUTTONS
        ===================================================== */

        .single-product-details .quantity-button {

            display: flex !important;

            align-items: center;

            justify-content: center;

            width: 52px;

            height: 52px;

            padding: 0;

            background:
                transparent !important;

            color:
                #ffffff !important;

            border: none !important;

            font-size: 23px;

            cursor: pointer;

            opacity: 1 !important;

            visibility: visible !important;

            transition:
                background var(--tv-transition),
                color var(--tv-transition);
        }


        .single-product-details .quantity-button:hover {

            background:
                rgba(139,92,246,0.18) !important;

            color:
                #b79cff !important;
        }


        /* =====================================================
           QUANTITY VALUE
        ===================================================== */

        .single-product-details .quantity-value {

            display: flex !important;

            align-items: center;

            justify-content: center;

            width: 58px;

            height: 52px;

            color:
                #ffffff !important;

            font-size: 16px;

            font-weight: 800;

            user-select: none;

            opacity: 1 !important;

            visibility: visible !important;
        }


        /* =====================================================
           ACTION BUTTON AREA
        ===================================================== */

        .product-action-buttons {

            display: flex;

            flex-direction: column;

            gap: 14px;

            width: 100%;

            margin-top: 35px;
        }


        /* =====================================================
           ADD TO CART
        ===================================================== */

        .single-product-details .add-cart-button {

            display: flex !important;

            align-items: center;

            justify-content: center;

            width: 100% !important;

            min-height: 60px;

            padding: 15px 25px;

            background:
                rgba(139,92,246,0.10) !important;

            color:
                #ffffff !important;

            border:
                1px solid
                rgba(139,92,246,0.75) !important;

            border-radius:
                10px !important;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 1.4px;

            cursor: pointer;

            text-transform: uppercase;

            opacity: 1 !important;

            visibility: visible !important;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.18);

            transition:
                background var(--tv-transition),
                border-color var(--tv-transition),
                transform var(--tv-transition),
                box-shadow var(--tv-transition);
        }


        .single-product-details .add-cart-button:hover {

            background:
                #8b5cf6 !important;

            color:
                #ffffff !important;

            border-color:
                #b79cff !important;

            transform:
                translateY(-3px);

            box-shadow:
                0 15px 40px
                rgba(139,92,246,0.28);
        }


        .single-product-details .add-cart-button:active {

            transform:
                translateY(0)
                scale(0.99);
        }


        /* =====================================================
           CART QUANTITY CONTROLS
        ===================================================== */

        .single-product-details .cart-quantity-controls {

            display: flex !important;

            align-items: center;

            justify-content: center;

            width: 100%;

            height: 60px;

            background:
                #17171c !important;

            border:
                1px solid
                #8b5cf6 !important;

            border-radius:
                10px !important;

            overflow: hidden;

            box-shadow:
                0 8px 25px
                rgba(139,92,246,0.10);

            opacity: 1 !important;

            visibility: visible !important;
        }


        .single-product-details .cart-quantity-button {

            display: flex !important;

            align-items: center;

            justify-content: center;

            width: 33.33%;

            height: 100%;

            background:
                transparent !important;

            color:
                #ffffff !important;

            border: none !important;

            font-size: 25px;

            cursor: pointer;

            transition:
                background var(--tv-transition),
                color var(--tv-transition);
        }


        .single-product-details .cart-quantity-button:hover {

            background:
                rgba(139,92,246,0.18) !important;

            color:
                #b79cff !important;
        }


        #cartQuantityValue {

            display: flex !important;

            align-items: center;

            justify-content: center;

            width: 33.33%;

            height: 100%;

            color:
                #ffffff !important;

            font-size: 18px;

            font-weight: 800;

            user-select: none;
        }


        /* =====================================================
           BUY NOW
        ===================================================== */

        .single-product-details .buy-now-button {

            display: flex !important;

            align-items: center;

            justify-content: center;

            width: 100% !important;

            min-height: 60px;

            padding: 15px 25px;

            background:
                #ffffff !important;

            color:
                #111111 !important;

            border:
                1px solid
                #ffffff !important;

            border-radius:
                10px !important;

            font-size: 14px;

            font-weight: 900;

            letter-spacing: 1.4px;

            cursor: pointer;

            text-transform: uppercase;

            opacity: 1 !important;

            visibility: visible !important;

            transition:
                background var(--tv-transition),
                border-color var(--tv-transition),
                transform var(--tv-transition),
                box-shadow var(--tv-transition);
        }


        .single-product-details .buy-now-button:hover {

            background:
                #f2efff !important;

            color:
                #111111 !important;

            border-color:
                #b79cff !important;

            transform:
                translateY(-3px);

            box-shadow:
                0 15px 40px
                rgba(139,92,246,0.18);
        }


        /* =====================================================
           PRODUCT MESSAGE
        ===================================================== */

        .product-message {

            min-height: 300px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            color:
                var(--tv-gray);

            font-size: 16px;
        }


        /* =====================================================
           DISABLED
        ===================================================== */

        .single-product-details button:disabled {

            opacity:
                0.55 !important;

            cursor:
                not-allowed !important;

            transform:
                none !important;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 950px) {

            .product-page {

                width:
                    min(
                        720px,

            }

            }
        }


        @media (max-width: 600px) {

            .product-page {

                width:
                    calc(100% - 28px);

                padding:
                    95px 0 60px;
            }


            .back-to-shop {

                margin-bottom:
                    25px;

                font-size:
                    12px;
            }


            .single-product-container {

                gap:
                    28px;
            }


            .single-product-name {

                font-size:
                    36px;

                letter-spacing:
                    -1px;
            }

                    26px;
            }


            .single-product-description {

            }


            .single-product-details .size-button {

                padding:
                    0 9px;

            }
        }

    </style>

    <!-- =====================================================
         PRODUCT JAVASCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           1. SUPABASE
        ===================================================== */

        const SUPABASE_URL =
            "https://gguzdxgxtpibbsfqtxjm.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_kli1NoCH59sG0Sa3I2-hTw_W909MSZX";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           2. GLOBAL VARIABLES
        ===================================================== */

        let currentProduct = null;

        let selectedSize = null;

        let selectedQuantity = 1;

        let productAlreadyInCart = false;


        /* =====================================================
           3. GET PRODUCT ID
        ===================================================== */

        function getProductId() {

            const parameters =
                new URLSearchParams(
                    window.location.search
                );

            return parameters.get("id");
        }


        /* =====================================================
           4. GET CART
        ===================================================== */

        function getCart() {

            try {

                return JSON.parse(
                    localStorage.getItem(
                        "threadverseCart"
                    )
                ) || [];

            } catch (error) {

                console.error(
                    "Cart parsing error:",
                    error
                );

                return [];
            }
        }


        /* =====================================================
           5. SAVE CART
        ===================================================== */

        function saveCart(cart) {

            localStorage.setItem(
                "threadverseCart",
                JSON.stringify(cart)
            );
        }


        /* =====================================================
           6. FIND CART ITEM
        ===================================================== */

        function findCartItem() {

            const cart = getCart();

            if (!currentProduct) {
                return null;
            }

            return cart.find(
                function (item) {

                    return (
                        String(item.id) ===
                        String(currentProduct.id)
                    );

                }
            ) || null;
        }


        /* =====================================================
           7. CHECK CART
        ===================================================== */

        function checkIfProductAlreadyInCart() {

            const existingItem =
                findCartItem();

            if (existingItem) {

                productAlreadyInCart = true;

                selectedQuantity =
                    Number(
                        existingItem.quantity
                    ) || 1;

                selectedSize =
                    existingItem.size || null;

            } else {

                productAlreadyInCart = false;

                selectedQuantity = 1;

                selectedSize = null;
            }
        }


        /* =====================================================
           8. LOAD PRODUCT
        ===================================================== */

        async function loadProduct() {

            const productId =
                getProductId();

            const productContainer =
                document.getElementById(
                    "productContainer"
                );


            if (!productId) {

                productContainer.innerHTML = `

                    <div class="product-message">

                        Product not found.

                    </div>

                `;

                return;
            }


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("products")
                        .select("*")
                        .eq("id", productId)
                        .single();


                if (error) {

                    console.error(
                        "Product loading error:",
                        error
                    );

                    productContainer.innerHTML = `

                        <div class="product-message">

                            Unable to load this product.

                        </div>

                    `;

                    return;
                }


                currentProduct = data;


                checkIfProductAlreadyInCart();


                displayProduct();


                console.log(
                    "Product loaded successfully:",
                    currentProduct
                );


            } catch (error) {

                console.error(
                    "Unexpected product error:",
                    error
                );


                productContainer.innerHTML = `

                    <div class="product-message">

                        Something went wrong while
                        loading this product.

                    </div>

                `;
            }
        }


        /* =====================================================
           9. DISPLAY PRODUCT
        ===================================================== */

        function displayProduct() {

            const productContainer =
                document.getElementById(
                    "productContainer"
                );


            const imageHTML =
                currentProduct.image
                    ? `

                        <img
                            src="${currentProduct.image}"
                            alt="${currentProduct.name || "THREADVERSE Product"}"
                            class="single-product-image"
                        >

                    `
                    : `

                        <div class="product-message">

                            IMAGE COMING SOON

                        </div>

                    `;


            productContainer.innerHTML = `

                <div class="single-product-container">


                    <!-- IMAGE -->

                    <div class="single-product-image-container">

                        ${imageHTML}

                    </div>


                    <!-- DETAILS -->

                    <div class="single-product-details">


                        <p class="single-product-category">

                            ${
                                currentProduct.category ||
                                "THREADVERSE"
                            }

                        </p>


                        <h1 class="single-product-name">

                            ${
                                currentProduct.name ||
                                "THREADVERSE Product"
                            }

                        </h1>


                        <p class="single-product-price">

                            ₹${
                                currentProduct.price || 0
                            }

                        </p>


                        <p class="single-product-description">

                            ${
                                currentProduct.description ||
                                "Premium custom wear by THREADVERSE."
                            }

                        </p>


                        <!-- SIZE -->

                        <p class="option-title">

                            SELECT SIZE

                        </p>


                        <div class="size-options">


                            <button
                                type="button"
                                class="size-button"
                                data-size="S"
                            >
                                S
                            </button>


                            <button
                                type="button"
                                class="size-button"
                                data-size="M"
                            >
                                M
                            </button>


                            <button
                                type="button"
                                class="size-button"
                                data-size="L"
                            >
                                L
                            </button>


                            <button
                                type="button"
                                class="size-button"
                                data-size="XL"
                            >
                                XL
                            </button>


                            <button
                                type="button"
                                class="size-button"
                                data-size="XXL"
                            >
                                XXL
                            </button>


                        </div>


                        <!-- QUANTITY -->

                        <p class="option-title">

                            QUANTITY

                        </p>


                        <div class="quantity-controls">


                            <button
                                type="button"
                                class="quantity-button"
                                id="decreaseQuantity"
                            >
                                −
                            </button>


                            <span
                                class="quantity-value"
                                id="quantityValue"
                            >
                                ${selectedQuantity}
                            </span>


                            <button
                                type="button"
                                class="quantity-button"
                                id="increaseQuantity"
                            >
                                +
                            </button>


                        </div>


                        <!-- ACTIONS -->

                        <div class="product-action-buttons">


                            ${createCartButtonHTML()}


                            <button
                                type="button"
                                id="buyNowButton"
                                class="buy-now-button"
                            >

                                BUY NOW

                            </button>


                        </div>


                    </div>

                </div>

            `;


            setupSizeButtons();

            setupQuantityButtons();

            setupCartButtons();

            setupBuyNowButton();

            restoreSelectedSize();
        }


        /* =====================================================
           10. CART BUTTON HTML
        ===================================================== */

        function createCartButtonHTML() {

            if (productAlreadyInCart) {

                return `

                    <div class="cart-quantity-controls">


                        <button
                            type="button"
                            id="cartDecreaseButton"
                            class="cart-quantity-button"
                        >
                            −
                        </button>


                        <span id="cartQuantityValue">

                            ${selectedQuantity}

                        </span>


                        <button
                            type="button"
                            id="cartIncreaseButton"
                            class="cart-quantity-button"
                        >
                            +
                        </button>


                    </div>

                `;
            }


            return `

                <button
                    type="button"
                    id="addToCartButton"
                    class="add-cart-button"
                >

                    ADD TO CART

                </button>

            `;
        }


        /* =====================================================
           11. SIZE BUTTONS
        ===================================================== */

        function setupSizeButtons() {

            const buttons =
                document.querySelectorAll(
                    ".size-button"
                );


            buttons.forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            selectedSize =
                                this.dataset.size;


                            buttons.forEach(
                                function (item) {

                                    item.classList.remove(
                                        "selected-size"
                                    );

                                }
                            );


                            this.classList.add(
                                "selected-size"
                            );


                            console.log(
                                "Selected size:",
                                selectedSize
                            );


                            if (
                                productAlreadyInCart
                            ) {

                                updateCartSize();
                            }

                        }
                    );

                }
            );
        }


        /* =====================================================
           12. RESTORE SIZE
        ===================================================== */

        function restoreSelectedSize() {

            if (!selectedSize) {

                return;
            }


            const button =
                document.querySelector(
                    `.size-button[data-size="${selectedSize}"]`
                );


            if (button) {

                button.classList.add(
                    "selected-size"
                );
            }
        }


        /* =====================================================
           13. QUANTITY BUTTONS
        ===================================================== */

        function setupQuantityButtons() {

            const decrease =
                document.getElementById(
                    "decreaseQuantity"
                );

            const increase =
                document.getElementById(
                    "increaseQuantity"
                );


            if (decrease) {

                decrease.addEventListener(
                    "click",
                    function () {

                        if (
                            selectedQuantity > 1
                        ) {

                            selectedQuantity--;

                            updateAllQuantityDisplays();

                            updateCartQuantityIfExists();
                        }

                    }
                );
            }


            if (increase) {

                increase.addEventListener(
                    "click",
                    function () {

                        selectedQuantity++;

                        updateAllQuantityDisplays();

                        updateCartQuantityIfExists();

                    }
                );
            }
        }


        /* =====================================================
           14. CART BUTTONS
        ===================================================== */

        function setupCartButtons() {

            const addButton =
                document.getElementById(
                    "addToCartButton"
                );


            if (addButton) {

                addButton.addEventListener(
                    "click",
                    addCurrentProductToCart
                );

                return;
            }


            const decrease =
                document.getElementById(
                    "cartDecreaseButton"
                );

            const increase =
                document.getElementById(
                    "cartIncreaseButton"
                );


            if (increase) {

                increase.addEventListener(
                    "click",
                    function () {

                        selectedQuantity++;

                        updateAllQuantityDisplays();

                        updateCartQuantity();

                    }
                );
            }


            if (decrease) {

                decrease.addEventListener(
                    "click",
                    function () {

                        if (
                            selectedQuantity > 1
                        ) {

                            selectedQuantity--;

                            updateAllQuantityDisplays();

                            updateCartQuantity();

                        } else {

                            removeCurrentProductFromCart();
                        }

                    }
                );
            }
        }


        /* =====================================================
           15. ADD PRODUCT TO CART
        ===================================================== */

        function addCurrentProductToCart() {

            if (!selectedSize) {

                alert(
                    "Please select a size first."
                );

                return;
            }


            let cart = getCart();


            const existingProduct =
                cart.find(
                    function (item) {

                        return (
                            String(item.id) ===
                            String(currentProduct.id)
                            &&
                            item.size ===
                            selectedSize
                        );

                    }
                );


            if (existingProduct) {

                existingProduct.quantity =
                    selectedQuantity;

            } else {

                cart.push({

                    id:
                        currentProduct.id,

                    name:
                        currentProduct.name,

                    price:
                        currentProduct.price,

                    image:
                        currentProduct.image,

                    category:
                        currentProduct.category,

                    description:
                        currentProduct.description,

                    size:
                        selectedSize,

                    quantity:
                        selectedQuantity

                });
            }


            saveCart(cart);


            productAlreadyInCart = true;


            replaceAddToCartWithControls();


            console.log(
                "Product added to cart:",
                cart
            );
        }


        /* =====================================================
           16. REPLACE ADD TO CART
        ===================================================== */

        function replaceAddToCartWithControls() {

            const button =
                document.getElementById(
                    "addToCartButton"
                );


            if (!button) {

                return;
            }


            button.outerHTML = `

                <div class="cart-quantity-controls">


                    <button
                        type="button"
                        id="cartDecreaseButton"
                        class="cart-quantity-button"
                    >
                        −
                    </button>


                    <span id="cartQuantityValue">

                        ${selectedQuantity}

                    </span>


                    <button
                        type="button"
                        id="cartIncreaseButton"
                        class="cart-quantity-button"
                    >
                        +
                    </button>


                </div>

            `;


            setupCartButtons();
        }


        /* =====================================================
           17. UPDATE QUANTITY DISPLAYS
        ===================================================== */

        function updateAllQuantityDisplays() {

            const quantity =
                document.getElementById(
                    "quantityValue"
                );

            const cartQuantity =
                document.getElementById(
                    "cartQuantityValue"
                );


            if (quantity) {

                quantity.textContent =
                    selectedQuantity;
            }


            if (cartQuantity) {

                cartQuantity.textContent =
                    selectedQuantity;
            }
        }


        /* =====================================================
           18. UPDATE CART QUANTITY
        ===================================================== */

        function updateCartQuantity() {

            let cart = getCart();


            const index =
                cart.findIndex(
                    function (item) {

                        return (
                            String(item.id) ===
                            String(currentProduct.id)
                            &&
                            item.size ===
                            selectedSize
                        );

                    }
                );


            if (index !== -1) {

                cart[index].quantity =
                    selectedQuantity;

                saveCart(cart);

                console.log(
                    "Cart quantity updated:",
                    selectedQuantity
                );
            }
        }


        /* =====================================================
           19. UPDATE CART QUANTITY IF EXISTS
        ===================================================== */

        function updateCartQuantityIfExists() {

            if (
                productAlreadyInCart &&
                selectedSize
            ) {

                updateCartQuantity();
            }


            const cartQuantity =
                document.getElementById(
                    "cartQuantityValue"
                );


            if (cartQuantity) {

                cartQuantity.textContent =
                    selectedQuantity;
            }
        }


        /* =====================================================
           20. UPDATE CART SIZE
        ===================================================== */

        function updateCartSize() {

            let cart = getCart();


            const index =
                cart.findIndex(
                    function (item) {

                        return (
                            String(item.id) ===
                            String(currentProduct.id)
                        );

                    }
                );


            if (index === -1) {

                return;
            }


            const duplicate =
                cart.find(
                    function (item, itemIndex) {

                        return (
                            itemIndex !== index
                            &&
                            String(item.id) ===
                            String(currentProduct.id)
                            &&
                            item.size ===
                            selectedSize
                        );

                    }
                );


            if (duplicate) {

                duplicate.quantity +=
                    selectedQuantity;


                cart.splice(index, 1);

            } else {

                cart[index].size =
                    selectedSize;

                cart[index].quantity =
                    selectedQuantity;
            }


            saveCart(cart);


            console.log(
                "Cart size updated:",
                selectedSize
            );
        }


        /* =====================================================
           21. REMOVE PRODUCT
        ===================================================== */

        function removeCurrentProductFromCart() {

            let cart = getCart();


            cart =
                cart.filter(
                    function (item) {

                        return !(
                            String(item.id) ===
                            String(currentProduct.id)
                        );

                    }
                );


            saveCart(cart);


            productAlreadyInCart = false;

            selectedQuantity = 1;

            selectedSize = null;


            const controls =
                document.querySelector(
                    ".cart-quantity-controls"
                );


            if (controls) {

                controls.outerHTML = `

                    <button
                        type="button"
                        id="addToCartButton"
                        class="add-cart-button"
                    >

                        ADD TO CART

                    </button>

                `;

                setupCartButtons();
            }


            updateAllQuantityDisplays();


            document
                .querySelectorAll(".size-button")
                .forEach(
                    function (button) {

                        button.classList.remove(
                            "selected-size"
                        );

                    }
                );


            console.log(
                "Product removed from cart."
            );
        }


        /* =====================================================
           22. BUY NOW
        ===================================================== */

        function setupBuyNowButton() {

            const buyNow =
                document.getElementById(
                    "buyNowButton"
                );


            if (!buyNow) {

                return;
            }


            buyNow.addEventListener(
                "click",
                function () {

                    if (!selectedSize) {

                        alert(
                            "Please select a size first."
                        );

                        return;
                    }


                    let cart = getCart();


                    const existingProduct =
                        cart.find(
                            function (item) {

                                return (
                                    String(item.id) ===
                                    String(currentProduct.id)
                                    &&
                                    item.size ===
                                    selectedSize
                                );

                            }
                        );


                    if (existingProduct) {

                        existingProduct.quantity =
                            selectedQuantity;

                    } else {

                        cart.push({

                            id:
                                currentProduct.id,

                            name:
                                currentProduct.name,

                            price:
                                currentProduct.price,

                            image:
                                currentProduct.image,

                            category:
                                currentProduct.category,

                            description:
                                currentProduct.description,

                            size:
                                selectedSize,

                            quantity:
                                selectedQuantity

                        });
                    }


                    saveCart(cart);


                    window.location.href =
                        "cart.html";
                }
            );
        }


        /* =====================================================
           23. START WEBSITE
        ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                console.log(
                    "THREADVERSE Product Page started successfully!"
                );

                loadProduct();

            }
        );

    </script>

</body>

</html>
